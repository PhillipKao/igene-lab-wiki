name: Deploy ECS Classroom Teaching Demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "publish/ecs-demo/**"
      - "workflows/verify_demo_publish.py"
      - ".github/workflows/deploy-ecs-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-ecs-demo"
  cancel-in-progress: false

jobs:
  build_and_verify:
    name: Verify Safe Publish Bundle & Upload Pages Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-publish clinical, asset, and preflight safety gate
        run: python3 workflows/verify_demo_publish.py --no-log

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ONLY the sanitized publish/ecs-demo directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/ecs-demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build_and_verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
